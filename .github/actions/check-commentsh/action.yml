name: Check commentsh docs
description: >-
  Runs commentsh --check on the given files and fails the build whenever any
  generated block is out of date. See https://github.com/EthanThatOneKid/commentsh
inputs:
  files:
    description: Newline-delimited file or directory paths to check.
    required: true
  version:
    description: >-
      commentsh ref (tag, branch, or commit) to run from GitHub raw. Leave
      empty to use the action's own ref, or when running the action locally.
      The ref must support --check --json.
    required: false
  deno-version:
    description: Deno version to install.
    required: false
    default: v2.x
outputs:
  changed:
    description: "true when any file is out of date"
    value: ${{ steps.check.outputs.changed }}
  stale-files:
    description: Newline-delimited list of out-of-date files
    value: ${{ steps.check.outputs.stale-files }}
runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@v2
      with:
        deno-version: ${{ inputs.deno-version }}
    - id: check
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        # Prefer an explicit version, then the action's own ref. Local
        # (in-repo) runs have no ref, so fall back to the checked-out file.
        REF="${INPUT_VERSION:-${ACTION_REF:-}}"
        if [ -n "${REF}" ]; then
          CSH="https://raw.githubusercontent.com/EthanThatOneKid/commentsh/${REF}/commentsh.ts"
        else
          CSH="./commentsh.ts"
        fi

        # --json keeps stdout as a single JSON array of stale-block entries,
        # one {file, line, tag} per block, so the outputs come from the
        # machine report instead of parsing the human text.
        ARGS=(--check --json)

        FILES=()
        while IFS= read -r line; do
          # Strip a carriage return for workflows saved with CRLF endings.
          line="${line%$'\r'}"
          [ -n "${line}" ] && FILES+=("${line}")
        done <<< "${INPUT_FILES}"

        ERR_FILE="$(mktemp)"
        OUT_FILE="$(mktemp)"
        set +e
        STDOUT="$(deno run --allow-read --allow-write --allow-run "${CSH}" "${ARGS[@]}" "${FILES[@]}" 2>"${ERR_FILE}")"
        STATUS=$?
        set -e

        # Keep the JSON report on stdout and the human diagnostics on stderr.
        printf '%s\n' "${STDOUT}" | tee "${OUT_FILE}"
        cat "${ERR_FILE}" >&2
        rm -f "${ERR_FILE}"

        # stdout is always valid JSON from --check --json; if it is not (for
        # example an old commentsh ref without --json), report no stale blocks
        # and let the non-zero STATUS fail the build.
        if command -v jq >/dev/null 2>&1 && jq -e . "${OUT_FILE}" >/dev/null 2>&1; then
          STALE_COUNT="$(jq -r 'length' "${OUT_FILE}")"
          STALE_FILES="$(jq -r '.[].file' "${OUT_FILE}" | sort -u)"
        else
          STALE_COUNT=0
          STALE_FILES=""
        fi
        rm -f "${OUT_FILE}"

        if [ "${STALE_COUNT}" -gt 0 ]; then
          echo "changed=true" >> "${GITHUB_OUTPUT}"
        else
          echo "changed=false" >> "${GITHUB_OUTPUT}"
        fi

        if [ -n "${STALE_FILES}" ]; then
          {
            echo "stale-files<<CSH_EOF"
            printf '%s\n' "${STALE_FILES}"
            echo "CSH_EOF"
          } >> "${GITHUB_OUTPUT}"
        fi

        exit "${STATUS}"
